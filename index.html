function buildDiagPrompt(answers) {
  const lines = [];
  STEPS.forEach(st => {
    const v = answers[st.id]; if(!v) return;
    const vals = Array.isArray(v)?v:[v];
    const lbls = vals.map(x=>st.options.find(o=>o.value===x)?.label||x).join(", ");
    lines.push(` ${st.title}  ${lbls}`);
  });
  return `Voici le profil d'un utilisateur de Mon Conseiller Auto :\n\n${lines.join("\n")}\n\nGenere une recommandation personnalisee en 4 sections :\n\n1.  **Motorisation recommandee** - explique laquelle correspond le mieux et pourquoi.\n2.  **Financement adapte** - conseille le mode le plus adapte avec ordres de grandeur concrets.\n3.  **2 ou 3 modeles a considerer** - modeles reels avec segment et fourchette de prix indicative.\n4.  **Points de vigilance** - pieges ou questions a anticiper.\n\nTermine par une invitation a poser des questions. Sois precis, concret, chaleureux. Reponds en francais.`;
}

async function callClaude(system, messages) {
  // Appel via backend Netlify - cle API invisible et securisee !
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, messages })
  });
  const d = await res.json();
  return d.text || "Desole, une erreur est survenue.";
}

async function callClaudeWithImage(system, messages) {
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, messages })
  });
  const d = await res.json();
  return d.text || "Desole, une erreur est survenue.";
}

function EmailGate({ onUnlock }) {
  const [email, setEmail] = useState("");
  const [nom, setNom] = useState("");
  const [tel, setTel] = useState("");
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);
  const [rgpd, setRgpd] = useState(false);

  const submit = async () => {
    if (!email.trim() || !nom.trim()) return;
    setLoading(true);
    // Store in localStorage
    localStorage.setItem("mca_email", email);
    localStorage.setItem("mca_nom", nom);
    localStorage.setItem("mca_unlocked", "true");
    // Send to a simple email notification (via mailto or webhook)
    setTimeout(() => {
      setLoading(false);
      setDone(true);
      setTimeout(() => onUnlock(), 1500);
    }, 800);
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#0d0d1a",border:"1px solid #1565C0",borderRadius:20,padding:"32px 28px",maxWidth:420,width:"100%"}}>
        {done ? (
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:16}}></div>
            <div style={{fontSize:18,fontWeight:700,color:"#fff",marginBottom:8}}>Merci {nom} !</div>
            <div style={{fontSize:14,color:"#666"}}>Acces illimite debloque...</div>
          </div>
        ) : (
          <>
            <div style={{fontSize:11,color:"#1565C0",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}> Acces limite</div>
            <div style={{fontSize:20,fontWeight:900,color:"#fff",marginBottom:8}}>Vous avez utilise vos 3 questions gratuites</div>
            <div style={{fontSize:13,color:"#666",lineHeight:1.7,marginBottom:24}}>Laissez vos coordonnees pour continuer a utiliser Mon Conseiller Auto gratuitement et etre recontacte par notre equipe.</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <input

                onChange={e=>setNom(e.target.value)}
                style={{background:"#07070f",border:"1px solid #1e1e2e",borderRadius:10,padding:"12px 14px",color:"#fff",fontSize:13,fontFamily:"inherit",outline:"none"}}
              />

                style={{background:"#07070f",border:"1px solid #1e1e2e",borderRadius:10,padding:"12px 14px",color:"#fff",fontSize:13,fontFamily:"inherit",outline:"none"}}
              />
              <input
                placeholder="Votre telephone (optionnel)"

                style={{background:"#07070f",border:"1px solid #1e1e2e",borderRadius:10,padding:"12px 14px",color:"#fff",fontSize:13,fontFamily:"inherit",outline:"none"}}
              />

}

// 
// SAV PANEL (with photo upload)
// 
function SAVPanel() {
  const [msgs, setMsgs] = useState([]);
  const [inp, setInp] = useState("");
  const [loading, setLoading] = useState(false);
  const [pendingImage, setPendingImage] = useState(null);
  const [pendingImageB64, setPendingImageB64] = useState(null);
  const [showGate, setShowGate] = useState(false);
  const [unlocked, setUnlocked] = useState(()=>localStorage.getItem("mca_unlocked")==="true");
  const [qCount, setQCount] = useState(0);
  const bottomRef = useRef(null);
  const fileRef = useRef(null);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs,loading]);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const full = ev.target.result;
      setPendingImage(full);
      setPendingImageB64(full.split(",")[1]);
    };
    reader.readAsDataURL(file);
  };

  const send = async (text, preRep) => {
    const txt = text || inp.trim();
    if((!txt && !pendingImage) || loading) return;
    if(!unlocked && qCount >= 3) { setShowGate(true); return; }
    setInp("");
    if(preRep && !pendingImage) {
      const newMsgs = [...msgs,{role:"user",content:txt}];
      setMsgs([...newMsgs,{role:"assistant",content:preRep}]);
      return;
    }
    setQCount(c=>c+1);

    const displayMsg = {role:"user", content: txt || "Analysez cette photo de mon vehicule.", image: pendingImage};
    const newMsgs = [...msgs, displayMsg];
    setMsgs(newMsgs);
    setLoading(true);

    const imageB64 = pendingImageB64;
    setPendingImage(null);
    setPendingImageB64(null);

    try {
      let apiMessages;
      if(imageB64) {
        const content = [];
        content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:imageB64}});
        content.push({type:"text",text: txt || "Analysez cette photo de mon vehicule et dites-moi ce que vous voyez, quel est le probleme eventuel et que dois-je faire ?"});
        apiMessages = [...msgs.filter(m=>!m.image).map(m=>({role:m.role,content:m.content})), {role:"user",content}];
      } else {
        apiMessages = newMsgs.map(m=>({role:m.role,content:m.content}));
      }
      const reply = await callClaudeWithImage(SYS_SAV, apiMessages);
      setMsgs([...newMsgs,{role:"assistant",content:reply}]);
    } catch {
      setMsgs([...newMsgs,{role:"assistant",content:" Erreur de connexion, veuillez reessayer."}]);
    } finally { setLoading(false); }
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 140px)",paddingTop:20,gap:14}}>
      {showGate && <EmailGate onUnlock={()=>{setUnlocked(true);setShowGate(false);}}/>}
      {msgs.length===0 ? (

function AchatPanel() {
  const [msgs, setMsgs] = useState([]);
  const [inp, setInp] = useState("");
  const [loading, setLoading] = useState(false);
  const [showGate, setShowGate] = useState(false);
  const [unlocked, setUnlocked] = useState(()=>{ try { return localStorage.getItem("mca_unlocked")==="true"; } catch(e) { return false; } });
  const [qCount, setQCount] = useState(0);
  const bottomRef = useRef(null);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs,loading]);

  const send = async (text, preRep) => {
    const txt = text||inp.trim(); if(!txt||loading) return;
    if(!unlocked && qCount >= 3) { setShowGate(true); return; }
    setInp("");
    const newMsgs = [...msgs,{role:"user",content:txt}];
    setMsgs(newMsgs);
    // Reponse pre-ecrite = 0 token !
    if(preRep) {
      setMsgs([...newMsgs,{role:"assistant",content:preRep}]);
      return;
    }
    setLoading(true);
    setQCount(c=>c+1);
    try {
      const reply = await callClaude(SYS_ACHAT, newMsgs);
      setMsgs([...newMsgs,{role:"assistant",content:reply}]);
      if(!unlocked && qCount >= 2) setTimeout(()=>setShowGate(true), 2000);
    } catch { setMsgs([...newMsgs,{role:"assistant",content:"Erreur de connexion."}]); }
    finally { setLoading(false); }
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 140px)",paddingTop:20,gap:14}}>
      {showGate && <EmailGate onUnlock={()=>{setUnlocked(true);setShowGate(false);}}/>}

          </div>
          <div>
            <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>Questions frequentes</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
              {ACHAT_TOPICS.map((t,i)=>(
                <button key={i} onClick={()=>send(t.q, t.rep)}
                  style={{background:"#0d0d1a",border:"1px solid #1e1e2e",borderRadius:12,padding:"12px 14px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:10,fontFamily:"inherit",transition:"border-color 0.15s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor="#1565C0"}
                  onMouseLeave={e=>e.currentTarget.style.borderColor="#1e1e2e"}>
                  <span style={{fontSize:18,flexShrink:0}}>{t.icon}</span>
                  <span style={{fontSize:12,color:"#ccc",lineHeight:1.4}}>{t.label}</span>
                </button>
              ))}
            </div>
          </div>
          <div ref={bottomRef}/>
        </div>
      ) : (
        <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:14,paddingBottom:8}}>
          {msgs.map((m,i)=><MsgBubble key={i} msg={m}/>)}
          {loading&&(
            <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
              <Avatar/><div style={{background:"#0d0d1a",border:"1px solid #1e1e2e",padding:"14px 18px",borderRadius:"18px 18px 18px 4px"}}><TypingDots/></div>

          )}

      <div style={{display:"flex",gap:8,alignItems:"flex-end",background:"#0d0d1a",border:"1px solid #1e1e2e",borderRadius:14,padding:"10px 12px"}}>

// ===================================================================
// QUESTION PRO
// ===================================================================
function ProPanel() {
  const [nom, setNom] = useState("");
  const [email, setEmail] = useState("");
  const [tel, setTel] = useState("");
  const [question, setQuestion] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [rgpdPro, setRgpdPro] = useState(false);
  const [mdp, setMdp] = useState("");
  const [adminOk, setAdminOk] = useState(false);
  const [questions, setQuestions] = useState(() => {
    try { return JSON.parse(localStorage.getItem("mca_questions") || "[]"); }
    catch(e) { return []; }
  });
  const [reponse, setReponse] = useState({});

  const MOT_DE_PASSE = "MonConseillerAuto2024";

  const submit = async () => {
    if(!nom.trim() || !email.trim() || !question.trim()) return;
    const nouvelleQ = {
      id: Date.now(),
      nom: nom.trim(),
      email: email.trim(),
      tel: tel.trim(),
      question: question.trim(),
      date: new Date().toLocaleDateString("fr-FR"),
      heure: new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}),
      repondue: false,
      reponse: ""
    };
    const newQs = [nouvelleQ, ...questions];
    setQuestions(newQs);
    try { localStorage.setItem("mca_questions", JSON.stringify(newQs)); } catch(e) {}

    // Envoyer par email via Formspree
    try {
      const formData = new FormData();
      formData.append("nom", nom.trim());
      formData.append("email", email.trim());
      formData.append("telephone", tel.trim() || "Non renseigne");
      formData.append("question", question.trim());
      formData.append("_replyto", email.trim());
      formData.append("_subject", "Nouvelle question - Mon Conseiller Auto - " + nom.trim());
      await fetch("https://formspree.io/f/xaqrlpqq", {
        method: "POST",
        body: formData,
        headers: {"Accept": "application/json"}
      });
    } catch(e) {}

    setNom(""); setEmail(""); setTel(""); setQuestion("");
    setSubmitted(true);
    setTimeout(() => setSubmitted(false), 4000);
  };

  const repondre = (id) => {
    const rep = reponse[id] || "";
    if(!rep.trim()) return;
    const newQs = questions.map(q => q.id === id ? {...q, repondue:true, reponse:rep} : q);
    setQuestions(newQs);
    try { localStorage.setItem("mca_questions", JSON.stringify(newQs)); } catch(e) {}
    setReponse(r => ({...r, [id]: ""}));
  };

  const loginAdmin = () => {
    if(mdp === MOT_DE_PASSE) { setAdminOk(true); }
    else { alert("Mot de passe incorrect"); }
  };

  if(showAdmin) {
    return (
      <div style={{paddingTop:24, paddingBottom:40}}>
        <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:20}}>
          <button onClick={()=>{setShowAdmin(false);setAdminOk(false);setMdp("");}}
            style={{background:"transparent", border:"1px solid #1e1e2e", color:"#888", padding:"8px 14px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:12}}>
            Retour
          </button>
          <div style={{fontSize:16, fontWeight:800}}>Espace Admin</div>
        </div>

        {!adminOk ? (
          <div style={{background:"#0d0d1a", border:"1px solid #1565C0", borderRadius:16, padding:"28px 24px", maxWidth:400, margin:"0 auto"}}>
            <div style={{fontSize:14, fontWeight:700, marginBottom:16, textAlign:"center"}}>Connexion administrateur</div>
            <input
              type="password"
              placeholder="Mot de passe"
              value={mdp}
              onChange={e=>setMdp(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&loginAdmin()}
              style={{width:"100%", background:"#07070f", border:"1px solid #1e1e2e", borderRadius:10, padding:"12px 14px", color:"#fff", fontSize:13, fontFamily:"inherit", outline:"none", marginBottom:12}}
            />
            <button onClick={loginAdmin}
              style={{width:"100%", background:"#1565C0", color:"#fff", border:"none", padding:"13px", borderRadius:10, fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"inherit"}}>
              Se connecter
            </button>
            <div style={{fontSize:11, color:"#444", textAlign:"center", marginTop:10}}>Acces reserve au professionnel</div>
          </div>
        ) : (
          <div style={{display:"flex", flexDirection:"column", gap:14}}>
            <div style={{fontSize:12, color:"#555"}}>
              {questions.length} question(s) recue(s) — {questions.filter(q=>!q.repondue).length} en attente
            </div>
            {questions.length === 0 ? (
              <div style={{textAlign:"center", padding:"40px", color:"#444"}}>Aucune question pour l'instant</div>
            ) : questions.map(q => (
              <div key={q.id} style={{background:"#0d0d1a", border:`1px solid ${q.repondue?"#1565C0":"#E85D04"}`, borderRadius:14, padding:"18px"}}>
                <div style={{display:"flex", justifyContent:"space-between", marginBottom:8}}>
                  <span style={{fontSize:13, fontWeight:700, color:"#fff"}}>{q.nom}</span>
                  <span style={{fontSize:11, color:"#555"}}>{q.date} {q.heure}</span>
                </div>
                <div style={{fontSize:12, color:"#42A5F5", marginBottom:4}}>{q.email} {q.tel && "| "+q.tel}</div>
                <div style={{fontSize:13, color:"#ccc", lineHeight:1.6, marginBottom:12, padding:"10px", background:"#07070f", borderRadius:8}}>{q.question}</div>
                {q.repondue ? (
                  <div style={{fontSize:12, color:"#4CAF50", background:"rgba(76,175,80,0.1)", border:"1px solid rgba(76,175,80,0.3)", borderRadius:8, padding:"10px"}}>
                    Repondu : {q.reponse}
                  </div>
                ) : (
                  <div style={{display:"flex", gap:8}}>
                    <textarea
                      placeholder="Votre reponse..."
                      value={reponse[q.id]||""}
                      onChange={e=>setReponse(r=>({...r,[q.id]:e.target.value}))}
                      rows={2}
                      style={{flex:1, background:"#07070f", border:"1px solid #1e1e2e", borderRadius:8, padding:"10px", color:"#fff", fontSize:12, fontFamily:"inherit", outline:"none", resize:"none"}}
                    />
                    <button onClick={()=>repondre(q.id)}
                      style={{background:"#1565C0", color:"#fff", border:"none", padding:"0 16px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:12, fontWeight:700}}>
                      OK
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{paddingTop:24, display:"flex", flexDirection:"column", gap:20, paddingBottom:40}}>
      <div style={{background:"#0d0d1a", border:"1px solid #1e1e2e", borderRadius:16, padding:"22px 20px"}}>
        <div style={{fontSize:17, fontWeight:800, marginBottom:8}}>Posez votre question a un professionnel</div>
        <div style={{fontSize:13, color:"#666", lineHeight:1.7}}>
          Laissez votre question et vos coordonnees. Un professionnel de l'automobile avec plus de 25 ans d'experience vous repondra personnellement dans les meilleurs delais.
        </div>
      </div>

      {submitted ? (
        <div style={{background:"#0d0d1a", border:"1px solid #1565C0", borderRadius:16, padding:"32px", textAlign:"center"}}>
          <div style={{fontSize:40, marginBottom:12}}>✓</div>
          <div style={{fontSize:16, fontWeight:700, color:"#42A5F5", marginBottom:8}}>Question envoyee !</div>
          <div style={{fontSize:13, color:"#666"}}>Un professionnel va vous repondre dans les meilleurs delais.</div>
        </div>
      ) : (
        <div style={{background:"#0d0d1a", border:"1px solid #1e1e2e", borderRadius:16, padding:"22px 20px", display:"flex", flexDirection:"column", gap:12}}>
          <input placeholder="Votre nom et prenom *" value={nom} onChange={e=>setNom(e.target.value)}
            style={{background:"#07070f", border:"1px solid #1e1e2e", borderRadius:10, padding:"12px 14px", color:"#fff", fontSize:13, fontFamily:"inherit", outline:"none"}}/>
          <input placeholder="Votre email *" value={email} onChange={e=>setEmail(e.target.value)}
            style={{background:"#07070f", border:"1px solid #1e1e2e", borderRadius:10, padding:"12px 14px", color:"#fff", fontSize:13, fontFamily:"inherit", outline:"none"}}/>
          <input placeholder="Votre telephone" value={tel} onChange={e=>setTel(e.target.value)}
            style={{background:"#07070f", border:"1px solid #1e1e2e", borderRadius:10, padding:"12px 14px", color:"#fff", fontSize:13, fontFamily:"inherit", outline:"none"}}/>
          <textarea placeholder="Votre question *" value={question} onChange={e=>setQuestion(e.target.value)} rows={4}
            style={{background:"#07070f", border:"1px solid #1e1e2e", borderRadius:10, padding:"12px 14px", color:"#fff", fontSize:13, fontFamily:"inherit", outline:"none", resize:"none"}}/>
          <label style={{display:"flex", alignItems:"flex-start", gap:10, cursor:"pointer"}}>
            <input type="checkbox" style={{marginTop:3, flexShrink:0, accentColor:"#1565C0"}}
              onChange={e=>setRgpdPro(e.target.checked)}/>
            <span style={{fontSize:11, color:"#888", lineHeight:1.6}}>
              J'accepte que mes donnees personnelles soient traitees par Mon Conseiller Auto pour repondre a ma demande. Conformement au RGPD, je peux exercer mes droits a monconseillerauto.fr@gmail.com.
            </span>
          </label>
          <button onClick={submit} disabled={!nom.trim()||!email.trim()||!question.trim()||!rgpdPro}
            style={{background:"#1565C0", color:"#fff", border:"none", padding:"14px", borderRadius:12, fontSize:14, fontWeight:700, cursor:nom&&email&&question&&rgpdPro?"pointer":"not-allowed", fontFamily:"inherit", opacity:nom&&email&&question&&rgpdPro?1:0.4}}>
            Envoyer ma question
          </button>
          <div style={{fontSize:11, color:"#444", textAlign:"center"}}>Reponse sous 24-48h par email</div>
        </div>
      )}


    </div>
  );
}

function AvisPanel() {
  const [avis, setAvis] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("mca_avis") || "[]");
    } catch(e) { return []; }
  });
  const [note, setNote] = useState(0);
  const [hover, setHover] = useState(0);
  const [commentaire, setCommentaire] = useState("");
  const [prenom, setPrenom] = useState("");
  const [submitted, setSubmitted] = useState(false);

  const moyenne = avis.length > 0
    ? (avis.reduce((s, a) => s + a.note, 0) / avis.length).toFixed(1)
    : null;

  const submit = () => {
    if(note === 0 || !commentaire.trim()) return;
    const nouvelAvis = {
      note,
      commentaire: commentaire.trim(),
      prenom: prenom.trim() || "Anonyme",
      date: new Date().toLocaleDateString("fr-FR"),
      id: Date.now()
    };
    const newAvis = [nouvelAvis, ...avis];
    setAvis(newAvis);
    try { localStorage.setItem("mca_avis", JSON.stringify(newAvis)); } catch(e) {}
    setNote(0);
    setCommentaire("");
    setPrenom("");
    setSubmitted(true);
    setTimeout(() => setSubmitted(false), 3000);
  };

  const Etoiles = ({ val, interactive }) => (
    <div style={{display:"flex", gap:4}}>
      {[1,2,3,4,5].map(i => (
        <span key={i}
          style={{fontSize: interactive ? 32 : 16, cursor: interactive ? "pointer" : "default",
            color: i <= (interactive ? (hover || val) : val) ? "#FFD700" : "#333",
            transition:"color 0.1s"}}
          onMouseEnter={() => interactive && setHover(i)}
          onMouseLeave={() => interactive && setHover(0)}
          onClick={() => interactive && setNote(i)}>
          {i <= (interactive ? (hover || val) : val) ? "★" : "☆"}
        </span>
      ))}
    </div>
  );

  return (
    <div style={{paddingTop:24, display:"flex", flexDirection:"column", gap:20, paddingBottom:40}}>

      {/* Stats */}
      {avis.length > 0 && (
        <div style={{background:"#0d0d1a", border:"1px solid #1e1e2e", borderRadius:16, padding:"22px 20px", display:"flex", alignItems:"center", gap:20}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:48, fontWeight:900, color:"#FFD700", lineHeight:1}}>{moyenne}</div>
            <Etoiles val={Math.round(moyenne)} interactive={false}/>
            <div style={{fontSize:11, color:"#555", marginTop:6}}>{avis.length} avis</div>
          </div>
          <div style={{flex:1}}>
            {[5,4,3,2,1].map(n => {
              const count = avis.filter(a => a.note === n).length;
              const pct = avis.length > 0 ? (count / avis.length * 100) : 0;
              return (
                <div key={n} style={{display:"flex", alignItems:"center", gap:8, marginBottom:4}}>
                  <span style={{fontSize:11, color:"#888", width:8}}>{n}</span>
                  <span style={{color:"#FFD700", fontSize:12}}>★</span>
                  <div style={{flex:1, height:6, background:"#1e1e2e", borderRadius:3, overflow:"hidden"}}>
                    <div style={{height:"100%", width:`${pct}%`, background:"#FFD700", borderRadius:3}}/>
                  </div>
                  <span style={{fontSize:11, color:"#555", width:20}}>{count}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Formulaire */}
      <div style={{background:"#0d0d1a", border:"1px solid #1e1e2e", borderRadius:16, padding:"22px 20px", display:"flex", flexDirection:"column", gap:14}}>
        <div style={{fontSize:15, fontWeight:800}}>Laissez votre avis</div>

        {submitted ? (

function SimulateurTab() {
  const [type, setType] = useState("credit");
  const [prix, setPrix] = useState(20000);
  const [apport, setApport] = useState(2000);
  const [duree, setDuree] = useState(48);
  const [taux, setTaux] = useState(4.5);
  const [vr, setVr] = useState(30); // valeur residuelle LOA en %
  const [result, setResult] = useState(null);
  const [aiComment, setAiComment] = useState("");
  const [aiLoading, setAiLoading] = useState(false);

  const calcCredit = () => {
    const capital = prix - apport;
    const tauxM = taux / 100 / 12;
    const mensualite = tauxM===0 ? capital/duree : capital * tauxM / (1 - Math.pow(1+tauxM,-duree));
    const total = mensualite * duree + apport;
    const coutCredit = total - prix;
    return { mensualite: Math.round(mensualite), total: Math.round(total), coutCredit: Math.round(coutCredit), capital: Math.round(capital) };
  };

  const calcLOA = () => {
    const vrEuros = prix * vr / 100;
    const capital = prix - apport - vrEuros / Math.pow(1 + taux/100/12, duree);
    const tauxM = taux / 100 / 12;
    const mensualite = tauxM===0 ? capital/duree : capital * tauxM / (1 - Math.pow(1+tauxM,-duree));
    return { mensualite: Math.round(Math.abs(mensualite)), vrEuros: Math.round(vrEuros), total: Math.round(Math.abs(mensualite)*duree+apport), capital: Math.round(prix-apport) };
  };

  const calc = () => {
    const r = type==="credit" ? calcCredit() : calcLOA();
    setResult(r);
    setAiComment("");
  };

  const getAiAdvice = async () => {
    if(!result) return;
    setAiLoading(true);
    const prompt = type==="credit"
      ? `Un client veut acheter un vehicule a ${prix}EUR avec un apport de ${apport}EUR, un credit sur ${duree} mois a ${taux}% de taux. La mensualite calculee est de ${result.mensualite}EUR/mois, cout total du credit : ${result.coutCredit}EUR. Donne un avis expert concis (5-6 lignes max) : est-ce un bon taux ? Des conseils pour optimiser ? Des alternatives a considerer ?`
      : `Un client veut faire une LOA pour un vehicule a ${prix}EUR, apport ${apport}EUR, ${duree} mois, taux ${taux}%, valeur residuelle ${vr}% (${result.vrEuros}EUR). Mensualite : ${result.mensualite}EUR/mois. Donne un avis expert concis (5-6 lignes max) : est-ce interessant ? Points de vigilance sur cette LOA ? Que regarder dans le contrat ?`;
    try {
      const reply = await callClaude(`Tu es Mon Conseiller Auto, expert financement automobile. Sois concis, direct, avec des conseils pratiques. Reponds en francais.`, [{role:"user",content:prompt}]);
      setAiComment(reply);
    } catch { setAiComment(" Erreur lors de l'analyse IA."); }
    finally { setAiLoading(false); }
  };

  const SliderInput = ({label, value, min, max, step, onChange, suffix}) => (
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,color:"#888"}}>{label}</span>
        <span style={{fontSize:14,fontWeight:700,color:"#1565C0"}}>{value.toLocaleString("fr-FR")}{suffix}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onChange(Number(e.target.value))}
        style={{width:"100%",accentColor:"#1565C0",height:4}}/>
      <div style={{display:"flex",justifyContent:"space-between"}}>
        <span style={{fontSize:10,color:"#444"}}>{min.toLocaleString("fr-FR")}{suffix}</span>
        <span style={{fontSize:10,color:"#444"}}>{max.toLocaleString("fr-FR")}{suffix}</span>
      </div>
    </div>
  );

  return (
    <div style={{paddingTop:24,display:"flex",flexDirection:"column",gap:20,paddingBottom:40}}>
      <div style={{background:"#0d0d1a",border:"1px solid #1e1e2e",borderRadius:16,padding:"22px 20px"}}>
        <div style={{fontSize:17,fontWeight:800,marginBottom:4}}> Simulateur de Financement</div>
        <div style={{fontSize:12,color:"#555"}}>Calculez vos mensualites et obtenez l'avis de notre IA</div>
      </div>

      {/* Type selector */}
      <div style={{display:"flex",gap:8}}>
        {[{id:"credit",label:" Credit classique"},{id:"loa",label:" LOA / Leasing"}].map(t=>(
          <button key={t.id} onClick={()=>{setType(t.id);setResult(null);setAiComment("");}}
            style={{flex:1,padding:"12px",borderRadius:12,border:`2px solid ${type===t.id?"#1565C0":"#1e1e2e"}`,background:type===t.id?"rgba(21,101,192,0.1)":"#0d0d1a",color:type===t.id?"#fff":"#666",fontWeight:type===t.id?700:400,cursor:"pointer",fontFamily:"inherit",fontSize:13,transition:"all 0.15s"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Sliders */}
      <div style={{background:"#0d0d1a",border:"1px solid #1e1e2e",borderRadius:16,padding:"22px 20px",display:"flex",flexDirection:"column",gap:20}}>
        <SliderInput label="Prix du vehicule" value={prix} min={5000} max={100000} step={500} onChange={setPrix} suffix=" EUR"/>
        <SliderInput label="Apport personnel" value={apport} min={0} max={Math.round(prix*0.5)} step={500} onChange={setApport} suffix=" EUR"/>
        <SliderInput label="Duree" value={duree} min={12} max={84} step={12} onChange={setDuree} suffix=" mois"/>
        <SliderInput label="Taux d'interet annuel" value={taux} min={0.5} max={12} step={0.1} onChange={setTaux} suffix=" %"/>
        {type==="loa" && <SliderInput label="Valeur residuelle" value={vr} min={10} max={50} step={1} onChange={setVr} suffix=" %"/>}
        <button onClick={calc}
          style={{background:"#1565C0",color:"#fff",border:"none",padding:"14px",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          Calculer mes mensualites 
        </button>
      </div>

      {/* Result */}
      {result && (
        <div style={{background:"#0d0d1a",border:"1px solid #1565C0",borderRadius:16,padding:"22px 20px",display:"flex",flexDirection:"column",gap:16}}>
          <div style={{fontSize:14,fontWeight:700,color:"#1565C0"}}> Resultat de la simulation</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div style={{background:"#07070f",borderRadius:12,padding:"16px",textAlign:"center"}}>
              <div style={{fontSize:11,color:"#555",marginBottom:6}}>MENSUALITE</div>
              <div style={{fontSize:28,fontWeight:900,color:"#1565C0"}}>{result.mensualite} EUR</div>
              <div style={{fontSize:10,color:"#444"}}>/ mois pendant {duree} mois</div>
            </div>
            <div style={{background:"#07070f",borderRadius:12,padding:"16px",textAlign:"center"}}>
              <div style={{fontSize:11,color:"#555",marginBottom:6}}>COUT TOTAL</div>
              <div style={{fontSize:28,fontWeight:900,color:"#fff"}}>{result.total.toLocaleString("fr-FR")} EUR</div>
              <div style={{fontSize:10,color:"#444"}}>apport inclus</div>
            </div>
            {type==="credit" && (
              <div style={{background:"#07070f",borderRadius:12,padding:"16px",textAlign:"center",gridColumn:"span 2"}}>
                <div style={{fontSize:11,color:"#555",marginBottom:6}}>COUT DU CREDIT</div>
                <div style={{fontSize:22,fontWeight:700,color:"#888"}}>{result.coutCredit.toLocaleString("fr-FR")} EUR</div>
                <div style={{fontSize:10,color:"#444"}}>interets et frais</div>
              </div>
            )}
            {type==="loa" && (
              <div style={{background:"#07070f",borderRadius:12,padding:"16px",textAlign:"center",gridColumn:"span 2"}}>
                <div style={{fontSize:11,color:"#555",marginBottom:6}}>OPTION D'ACHAT EN FIN DE LOA</div>
                <div style={{fontSize:22,fontWeight:700,color:"#888"}}>{result.vrEuros.toLocaleString("fr-FR")} EUR</div>
                <div style={{fontSize:10,color:"#444"}}>{vr}% de la valeur du vehicule</div>
              </div>
            )}
          </div>

          {!aiComment && (
            <button onClick={getAiAdvice} disabled={aiLoading}
              style={{background:"transparent",border:"1px solid #1565C0",color:"#1565C0",padding:"12px",borderRadius:12,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",opacity:aiLoading?0.6:1}}>
              {aiLoading ? "Analyse en cours..." : " Obtenir l'avis de notre expert IA"}
            </button>
          )}
          {aiComment && (
            <div style={{background:"#07070f",border:"1px solid #1e1e2e",borderRadius:12,padding:"16px"}}>
              <div style={{fontSize:11,color:"#1565C0",fontWeight:700,marginBottom:8}}> AVIS EXPERT</div>
              <div style={{fontSize:13,color:"#ccc",lineHeight:1.7}}>
                {aiComment.split("\n").map((l,i,arr)=><span key={i}>{l}{i<arr.length-1&&<br/>}</span>)}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ProgressBar({current,total}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      <div style={{flex:1,height:4,background:"#1a1a2e",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",background:"#1565C0",borderRadius:4,transition:"width 0.4s ease",width:`${Math.round(current/total*100)}%`}}/>
      </div>
      <span style={{fontSize:11,color:"#555",flexShrink:0}}>{current}/{total}</span>
    </div>
  );
}

function OptionCard({option,selected,onClick}) {
  return (
    <button onClick={onClick}
      style={{width:"100%",border:`1px solid ${selected?"#1565C0":"#1e1e2e"}`,borderRadius:12,padding:"13px 16px",cursor:"pointer",textAlign:"left",fontFamily:"inherit",background:selected?"rgba(21,101,192,0.08)":"#0d0d1a",transition:"all 0.15s"}}
      onMouseEnter={e=>{if(!selected)e.currentTarget.style.borderColor="#3a3a5e";}}
      onMouseLeave={e=>{if(!selected)e.currentTarget.style.borderColor="#1e1e2e";}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:20,flexShrink:0,width:28,textAlign:"center"}}>{option.icon}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:selected?"#fff":"#ccc"}}>{option.label}</div>
          {option.desc&&<div style={{fontSize:11,color:"#555",marginTop:2}}>{option.desc}</div>}
        </div>
        <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${selected?"#1565C0":"#333"}`,background:selected?"#1565C0":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          {selected&&<span style={{color:"#fff",fontSize:10,fontWeight:700}}></span>}
        </div>
      </div>
    </button>
  );
}

function DiagnosticTab() {
  const [phase, setPhase] = useState("home");
  const [stepIdx, setStepIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [messages, setMessages] = useState([]);
  const [chatInp, setChatInp] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const bottomRef = useRef(null);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[messages,chatLoading]);

  const step = STEPS[stepIdx];
  const answer = answers[step?.id];
  const toggle = (val) => {
    if(step.type==="single") { setAnswers(a=>({...a,[step.id]:val})); }
    else {
      const cur = answers[step.id]||[]; const max=step.max||99;
      if(cur.includes(val)) setAnswers(a=>({...a,[step.id]:cur.filter(v=>v!==val)}));
      else if(cur.length<max) setAnswers(a=>({...a,[step.id]:[...cur,val]}));
    }
  };
  const canNext = step?.type==="single"?!!answer:(answer?.length||0)>0;

  const next = async () => {
    if(stepIdx<STEPS.length-1) { setStepIdx(i=>i+1); return; }
    setPhase("loading");
    try {
      const reply = await callClaude(`Expert auto. Francais. 3 lignes max. Pas emojis.`, [{role:"user",content:buildDiagPrompt({...answers})}]);
      setMessages([{role:"assistant",content:reply}]);
      setPhase("result");
    } catch { setMessages([{role:"assistant",content:" Erreur, veuillez reessayer."}]); setPhase("result"); }
  };

  const sendChat = async () => {
    const txt = chatInp.trim(); if(!txt||chatLoading) return;
    setChatInp("");
    const history = [{role:"user",content:buildDiagPrompt(answers)},...messages,{role:"user",content:txt}];
    setMessages(m=>[...m,{role:"user",content:txt}]);
    setChatLoading(true);
    try {
      const reply = await callClaude(`Expert auto. Francais. 3 lignes max. Pas emojis.`, history);
      setMessages(m=>[...m,{role:"assistant",content:reply}]);
    } catch { setMessages(m=>[...m,{role:"assistant",content:" Erreur."}]); }
    finally { setChatLoading(false); }
  };

  const reset = () => { setPhase("home"); setStepIdx(0); setAnswers({}); setMessages([]); setChatInp(""); };

  if(phase==="home") return (
    <div style={{display:"flex",flexDirection:"column",gap:40,paddingTop:36}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:16}}>
        <div style={{display:"inline-block",background:"rgba(21,101,192,0.1)",border:"1px solid rgba(21,101,192,0.3)",color:"#1565C0",padding:"5px 14px",borderRadius:20,fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600}}>Diagnostic personnalise</div>
        <h1 style={{fontSize:44,fontWeight:900,lineHeight:1.1,letterSpacing:"-0.02em"}}>Trouvez le vehicule<br/><span style={{color:"#1565C0"}}>fait pour vous</span></h1>
        <p style={{fontSize:15,color:"#666",lineHeight:1.8,maxWidth:480}}>Repondez a {STEPS.length} questions en 2 minutes. Notre IA analyse votre profil et vous recommande la motorisation, le financement et les modeles qui vous correspondent vraiment.</p>
        <div style={{display:"flex",gap:28,justifyContent:"center"}}>
          {[["2 min","pour repondre"],["7","questions cles"],["100%","personnalise"]].map(([n,l])=>(
            <div key={n} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontSize:26,fontWeight:900,color:"#1565C0"}}>{n}</span>
              <span style={{fontSize:10,color:"#555",letterSpacing:"0.06em",textTransform:"uppercase"}}>{l}</span>
            </div>
          ))}
        </div>
        <button style={{background:"#1565C0",color:"#fff",border:"none",padding:"16px 40px",borderRadius:12,fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>setPhase("quiz")}>
          Demarrer mon diagnostic
        </button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:12}}>
        {[{icon:"",t:"Motorisation",d:"Electrique, hybride, diesel, essence : ce qui colle a votre usage reel."},{icon:"",t:"Financement",d:"LOA, LLD, credit ou comptant - avantages fiscaux inclus pour les pros."},{icon:"",t:"Modeles concrets",d:"Des recommandations de vehicules reels, pas des generalites."}].map(c=>(
          <div key={c.t} style={{background:"#0d0d1a",border:"1px solid #141424",borderRadius:14,padding:"20px 18px",display:"flex",flexDirection:"column",gap:10}}>
            <span style={{fontSize:26}}>{c.icon}</span>
            <div style={{fontSize:14,fontWeight:700}}>{c.t}</div>
            <div style={{fontSize:12,color:"#555",lineHeight:1.6}}>{c.d}</div>
          </div>
        ))}
      </div>
    </div>
  );

  if(phase==="quiz") return (
    <div style={{display:"flex",flexDirection:"column",gap:20,paddingTop:28,maxWidth:600,margin:"0 auto",width:"100%"}}>
      <ProgressBar current={stepIdx+1} total={STEPS.length}/>
      <div style={{background:"#0d0d1a",border:"1px solid #141424",borderRadius:18,padding:"26px 22px",display:"flex",flexDirection:"column",gap:14}}>
        <div style={{fontSize:10,color:"#1565C0",fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase"}}>Etape {stepIdx+1} sur {STEPS.length}</div>
        <h2 style={{fontSize:20,fontWeight:800,lineHeight:1.3}}>{step.title}</h2>
        <p style={{fontSize:13,color:"#666",marginTop:-6}}>{step.subtitle}</p>
        {step.max&&<p style={{fontSize:11,color:"#1565C0",background:"rgba(21,101,192,0.08)",padding:"4px 10px",borderRadius:6,display:"inline-block",alignSelf:"flex-start"}}>Choisissez jusqu'a {step.max}</p>}
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {step.options.map(opt=>{
            const sel = step.type==="single"?answer===opt.value:(answer||[]).includes(opt.value);
            return <OptionCard key={opt.value} option={opt} selected={sel} onClick={()=>toggle(opt.value)}/>;
          })}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
          <button style={{background:"transparent",border:"1px solid #222238",color:stepIdx>0?"#888":"transparent",padding:"11px 20px",borderRadius:10,fontSize:13,cursor:stepIdx>0?"pointer":"default",fontFamily:"inherit"}} onClick={()=>stepIdx>0&&setStepIdx(i=>i-1)} disabled={stepIdx===0}>Precedent</button>
          <button style={{background:"#1565C0",color:"#fff",border:"none",padding:"12px 24px",borderRadius:10,fontSize:13,fontWeight:700,cursor:canNext?"pointer":"not-allowed",fontFamily:"inherit",opacity:canNext?1:0.35}} onClick={canNext?next:undefined} disabled={!canNext}>
            {stepIdx===STEPS.length-1?"Obtenir mon diagnostic ":"Suivant"}
          </button>
        </div>
      </div>
    </div>
  );

  if(phase==="loading") return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flex:1,gap:20,paddingTop:100}}>
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" stroke="#1a1a2e" strokeWidth="6" fill="none"/>
        <circle cx="40" cy="40" r="34" stroke="#1565C0" strokeWidth="6" fill="none" strokeDasharray="60 150" strokeLinecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="1s" repeatCount="indefinite"/>
        </circle>
      </svg>
      <p style={{fontSize:18,fontWeight:700}}>Analyse de votre profil...</p>
      <p style={{fontSize:13,color:"#555",textAlign:"center",maxWidth:340}}>Notre IA croise vos reponses pour vous proposer les meilleures options</p>
    </div>
  );

  const chips = Object.entries(answers).slice(0,4).flatMap(([key,val])=>{
    const st=STEPS.find(s=>s.id===key); const vals=Array.isArray(val)?val:[val];
    return vals.map(v=>st?.options.find(o=>o.value===v)?.label||v);
  });

  return (
    <div style={{display:"flex",flexDirection:"column",paddingTop:20,height:"calc(100vh - 140px)"}}>
      <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:7,marginBottom:14}}>
        <span style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:"0.08em",marginRight:4}}>Profil :</span>
        {chips.map((c,i)=><span key={i} style={{background:"#0d0d1a",border:"1px solid #1e1e2e",borderRadius:20,padding:"3px 10px",fontSize:11,color:"#888"}}>{c}</span>)}
        <button style={{marginLeft:"auto",background:"transparent",border:"1px solid #1e1e2e",color:"#555",padding:"3px 10px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit"}} onClick={reset}> Refaire</button>
      </div>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:14,paddingBottom:8}}>
        {messages.map((m,i)=><MsgBubble key={i} msg={m}/>)}
        {chatLoading&&(
          <div style={{display:"flex",gap:10,alignItems:"flex-end"}}><Avatar/><div style={{background:"#0d0d1a",border:"1px solid #1e1e2e",padding:"14px 18px",borderRadius:"18px 18px 18px 4px"}}><TypingDots/></div></div>
        )}
        <div ref={bottomRef}/>
      </div>

      </div>
    </div>
  );
}
